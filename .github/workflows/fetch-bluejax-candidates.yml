name: Fetch BlueJax candidate tracks

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch-bluejax-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch BlueJax catalog audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tracks
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://stream.bluejax.ai/catalog/pc-v1/a91d5ddc-a9cb-4ce8-ae5a-50787e592d2b.mp3" \
            --output "tracks/Dancing_Into_Sunrise.mp3"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://stream.bluejax.ai/catalog/pc-v1/a880d28f-e5ed-4a76-b748-024e8cf730e9.mp3" \
            --output "tracks/Neon_Horizon.mp3"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://stream.bluejax.ai/catalog/pc-v1/a8566a30-2e23-4d5e-9fa5-cb8c967560e7.mp3" \
            --output "tracks/Cant_Shake_the_Sun.mp3"
          ls -lh tracks
          file tracks/*.mp3

      - name: Upload candidate tracks
        uses: actions/upload-artifact@v4
        with:
          name: bluejax-candidate-tracks
          path: tracks/*.mp3
          if-no-files-found: error
          retention-days: 1
